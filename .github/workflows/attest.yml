name: attest

# Continuous attestation. Because the whole pipeline is deterministic, every run
# re-proves, publicly and with a timestamp, that the Safe transaction pinned in
# attest.toml is exactly the output of the pinned producer commit. A green run is
# the artifact a third party can trust without re-running anything themselves.

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # daily: also re-checks the live Safe queue for drift

permissions:
  contents: read

jobs:
  test:
    # The verifier's own tests: the Solidity and cast derivations must agree on
    # every supported JSON shape before any attestation they produce means much.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1

      - name: Solidity tests
        run: forge test -vv

      - name: Shell tests (normalisation, cross-derivation, end-to-end)
        run: ./test/shell/run.sh

  attest:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Run through the action rather than calling attest.sh directly, so the
      # action published from this repo is exercised on every push instead of
      # only in consumers' pipelines. `uses: ./` is the local checkout.
      #
      # NOTE: in CI, producer_repo in attest.toml must be a reachable git URL
      # (e.g. https://github.com/you/your-ops-repo), not a local file:// path.
      - name: Attest
        id: attest
        uses: ./
        with:
          config: attest.toml
          # Set require-live: true to fail the build when the queued tx drifts
          # from the script output, instead of skipping an unreachable service.

      - name: Check the action's outputs are populated
        run: |
          set -eu
          echo "attested:  ${{ steps.attest.outputs.attested }}"
          echo "safeTx:    ${{ steps.attest.outputs.safe-tx-hash }}"
          echo "canonical: ${{ steps.attest.outputs.canonical-sha256 }}"
          [[ "${{ steps.attest.outputs.attested }}" == "true" ]]
          [[ "${{ steps.attest.outputs.safe-tx-hash }}" =~ ^0x[0-9a-f]{64}$ ]]
