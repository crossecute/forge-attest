# forge-attest: attesting a Safe{Wallet} Transaction Builder batch
#
# A worked example for the shape emitted by FraxFinance's `SafeTxHelper.writeTxs`
# and by the Safe UI's "export batch". Copy it, fill in the four pinned values,
# and run:
#
#   ./attest.sh --config attest.batch.toml
#
# The difference from a flat SafeTx claim is that a batch carries no Safe address,
# no nonce and no gas fields. Those are supplied here, and they are *inputs to the
# hash*. The same batch signs as a different transaction on a different Safe, or
# at a different nonce. Getting them wrong produces a hash mismatch, not a silent
# pass.

# --- Producer -------------------------------------------------------------------
producer_repo   = "https://github.com/crossecute/forge-attest-example-safe-ops"
producer_commit = "31d44a89684f6f3721eae59ada1d230a1738f6bb"
producer_setup  = ""                                          # e.g. "forge install"
producer_script = "script/BuildSafeBatch.s.sol:BuildSafeBatch"
output_path     = "out/safe-batch.json"

# --- Input shape ------------------------------------------------------------------
# `auto` detects the batch envelope; naming it explicitly is a cheap extra guard
# against a producer that silently changes its output format.
input_format = "tx-builder"
batch_mode   = "auto"     # multiSend when >1 tx, direct call when exactly 1

# Blank uses the canonical MultiSendCallOnly for `safe_version`, which is what
# Safe{Wallet} does. Point this at the plain MultiSend
# (0xA238CBeb142c10Ef7Ad8442C6D1f9E89e07e7761 on 1.3.0) only if the batch contains
# inner DELEGATECALLs.
multisend_address = ""
safe_version      = "1.3.0"
chain_id          = ""    # the batch envelope already carries chainId

safe_tx_gas     = "0"
base_gas        = "0"
gas_price       = "0"
gas_token       = "0x0000000000000000000000000000000000000000"
refund_receiver = "0x0000000000000000000000000000000000000000"

# --- Pinned expectations ----------------------------------------------------------
# `SafeTxHelper` stamps `createdAt` with `block.timestamp * 1000`, so the raw bytes
# differ on every run and a byte-exact sha256 cannot be pinned. Leave
# expected_output_sha256 blank and pin the canonical digest instead. It is computed
# from the normalised SafeTx and is unaffected by timestamps, key order, address
# checksum casing or string-vs-number scalars.
#
# The values below were derived from the pinned commit above; run once with them
# blank and the orchestrator prints them for you to paste back in after you have
# reviewed the transaction.
expected_output_sha256    = ""
expected_canonical_sha256 = "3e04aa55c436e16cae1ce12e2c43922536ce1a1dfad9d6041c874ad382768efd"
expected_safe_tx_hash     = "0x7f9d67d21eabf50afc3c0ef625d519918b4ca7037730caa7544576e12ad0c115"

# --- The Safe the batch is bound to -------------------------------------------------
safe_network = "ethereum"
safe_address = "0x111CEEee040739fD91D29C34C33E6B3E112F2177"
safe_nonce   = "43"

# --- Nested Safe (optional) -------------------------------------------------------
# When the Safe above is owned by other Safes, a child cannot sign. It approves
# on-chain by calling `safe_address.approveHash(<the hash derived above>)`. That
# approval is a Safe transaction in its own right, and it is the one the child's
# owners actually sign.
#
# There is no artifact for it: every field is determined by the parent hash, the
# child Safe and the child's nonce, so forge-attest constructs it. Set these and
# the run reports the hash the child's owners should expect to see.
#
# Note the expiry: the parent hash binds the parent's nonce, and `approveHash`
# stores only a flag against (owner, hash). If the parent's nonce moves, every
# approval silently stops matching.
child_safe    = ""
child_nonce   = ""
child_network = ""   # set to also check what is queued on the child itself
expected_child_safe_tx_hash = ""
